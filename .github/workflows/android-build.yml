# MARIOBOX build gate.
#
# Two jobs, in the order that fails fastest:
#
#   native  -- the C++ host and the vendored core, built and run against a generated
#              test ROM on plain Linux with gcc. This is the job that proves the
#              emulator half of the project works without an Android SDK in sight
#              (docs/PLAN.md §1 says the sandbox cannot build an APK; the same
#              reasoning is why the engine gets a host-side gate here).
#   android -- the Gradle build: unit tests, debug APK, release APK, lint.
#
# No AAB, no Telegram: this app is sideloaded, so a universal APK is the artifact and
# a bundle would only add a signing step nobody uses (see docs/PLAN.md "التجاوزات").

name: MARIOBOX Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: 28.2.13676358
  SDK_PLATFORM: android-36
  BUILD_TOOLS: 36.0.0

jobs:
  native:
    name: Host tests (N1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev python3
          gcc --version
          nproc

      - name: Core source list matches the vendored makefile fragment
        run: make -C engine/src/test/native check-source-list

      - name: Build host + core
        run: make -C engine/src/test/native -j"$(nproc)"

      - name: Run the conformance suite
        # 600+ frames of a generated probe ROM, save states, rewind, SRAM, cheat
        # decoders, core options -- the same C ABI the JNI bridge calls.
        run: make -C engine/src/test/native run

      - name: Build with CMake too (the Android half's configure path)
        run: |
          cmake -S engine/src/main/cpp -B build/cmake-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cmake-host -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-test-output
          path: build/test-out.txt
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: APK build (N4)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;${{ env.SDK_PLATFORM }}" "build-tools;${{ env.BUILD_TOOLS }}" "ndk;${{ env.NDK_VERSION }}" "cmake;3.31.6"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle unit tests (N2)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Lint (informational)
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p out
          [ -f app/build/outputs/apk/debug/app-debug.apk ] && cp app/build/outputs/apk/debug/app-debug.apk out/MarioBox-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/MarioBox-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk out/MarioBox-release.apk
          fi
          (cd out && sha256sum *.apk > SHA256SUMS 2>/dev/null || true)
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarioBox-apk
          path: out/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Send Release APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || '8459296920:AAGq6b6sguUQx0Abk7jbWFDma30v7Ncfbhc' }}
          CHAT_ID: ${{ secrets.CHAT_ID || '5926222376' }}
        run: |
          APK_FILE="out/MarioBox-release.apk"
          [ -f "$APK_FILE" ] || APK_FILE="out/MarioBox-debug.apk"
          if [ -f "$APK_FILE" ]; then
            python3 tools/send_apk_telegram.py "$APK_FILE" || true
          fi

# JVM heap for a 650-file NDK compile inside the Gradle daemon.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=false
# Left off: the CMake/NDK task graph under AGP 9 still trips the configuration cache
# on first builds, and a build that has to work in CI beats one that is 4s faster.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

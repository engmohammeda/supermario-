# Android Studio and CI both honour this file. Run `gradle wrapper` once locally if
# you want ./gradlew to work without the IDE (it writes gradle-wrapper.jar, which is
# deliberately not committed here -- see docs/BUILD.md).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
